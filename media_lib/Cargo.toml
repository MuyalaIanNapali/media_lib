[package]
name = "media_lib"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for the Android .so (JNI); lib so the test harness can link the crate.
crate-type = ["cdylib", "lib"]

[dependencies]
rand = "0.8"
dryoc = "2.0.0"
jni = "0.21"
aes = "0.9.3"
ctr = "0.10.1"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.13.0"
thiserror = "1"
